{% extends 'base.html' %}

{% block content %}
<h1>Add New Project</h1>
{% with messages = get_flashed_messages() %}
{% if messages %}
<ul class="flashes">
    {% for message in messages %}
    <li>{{ message }}</li>
    {% endfor %}
</ul>
{% endif %}
{% endwith %}

<form method="post">
    <label for="title">Title</label><br>
    <input type="text" required id="title" name="title"><br>

    <div class="mb-3">
        <label for="language" class="form-label fw-bold">Build Systems</label>
        <select multiple class="form-select" id="language" name="language[]" size="5">
            {% set systems = ['C++', 'Python', 'Java', 'C', 'System verilog'] %}
            {% for sys in systems %}
            <option value="{{ sys }}"
                    {% if parameters and parameters.build_systems and sys in parameters.build_systems
                    %}selected{% endif %}>
                {{ sys }}
            </option>
            {% endfor %}
        </select>
        <small class="text-muted">Hold Ctrl to multiple select</small>
    </div>

    <label for="category">Project category (Optional param)</label><br>
    <input type="text" id="category" name="Category"><br>

    <input type="submit" value="Submit">
</form>

{% endblock %}
