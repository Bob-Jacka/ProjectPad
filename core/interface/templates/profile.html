{% extends 'base.html' %}

{% block title %}My profile{% endblock %}

{% block content %}
<div class="container my-5">
    <h1 class="mb-4">My profile</h1>

    <form method="post" action="/profile">
        <div class="mb-3">
            <label for="proj_goal" class="form-label">Project goals</label>
            <input type="text" class="form-control" id="proj_goal" name="proj_goal"
                   placeholder="Enter your project goals" required>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
    </form>
</div>
{% endblock %}
